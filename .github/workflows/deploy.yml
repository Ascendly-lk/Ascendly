name: CI + CD — Deploy to Azure

on:
  push:
    branches: ["Main"]
  workflow_dispatch:

jobs:
  # ── 1. Backend Tests (deterministic only — no LLM cost) ───────────────────
  backend-test:
    name: pytest (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install --upgrade pip && pip install -r requirements.txt -r requirements-test.txt

      - name: Run deterministic tests
        working-directory: backend
        env:
          PHOENIX_ENABLED: "false"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          pytest tests/test_analyst_agent.py tests/test_forecaster_mape.py \
            -v --tb=short --no-header -p no:warnings

  # ── 2. Deploy Backend → Azure App Service ────────────────────────────────
  deploy-backend:
    name: Deploy FastAPI → Azure App Service
    runs-on: ubuntu-latest
    needs: [backend-test]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ascendly-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

  # ── 3. Build + Deploy Frontend → Azure Static Web Apps ───────────────────
  deploy-frontend:
    name: Build + Deploy React → Azure Static Web Apps
    runs-on: ubuntu-latest
    needs: [backend-test]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_MANGO_GROUND_00BF1871E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "frontend"
          output_location: "dist"
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
